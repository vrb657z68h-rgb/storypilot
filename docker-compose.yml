# Startet Storypilot mit automatischem HTTPS (Caddy).
# Vorher: .env ausfüllen und in "Caddyfile" deine Domain eintragen.
services:
  app:
    build: .
    env_file: .env
    volumes:
      - ./data:/data
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    restart: unless-stopped
volumes:
  caddy_data:
